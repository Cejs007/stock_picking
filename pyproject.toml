[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-picking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yfinance>=0.2",
    "pandas>=2.0",
    "plotly>=5.0",
    "streamlit>=1.30",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_picking"]
